name: toolbox
description: 多功能工具箱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 2.5.1
  go_router: 14.2.7

  drift: 2.20.3
  sqlite3_flutter_libs: 0.5.24
  path_provider: 2.1.4
  path: ^1.9.1

  fl_chart: 0.69.0
  intl: ^0.20.3
