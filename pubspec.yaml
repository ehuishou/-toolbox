name: toolbox
description: 多功能工具箱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 2.5.1
  go_router: 14.2.7

  drift: 2.20.3
  # 0.5.24 的 android/build.gradle 写死 compileSdkVersion 32，与其传递依赖
  # androidx.window.extensions.core（要求 33+）冲突，release 构建失败。
  # 0.5.42 上游已将 compileSdk 提到 35。注意不要升到 0.6.0+eol（废弃占位版本）。
  sqlite3_flutter_libs: 0.5.42
  path_provider: 2.1.4
  path: ^1.9.1

  fl_chart: 0.69.0
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: 2.4.13
  drift_dev: 2.20.3

flutter:
  uses-material-design: true
